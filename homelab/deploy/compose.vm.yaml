# control trên VM trong mạng LAN: trình duyệt và Pi cùng gọi http://<ip-vm>:8800.
# Không chạy tay: dùng `bash install-vm.sh` (tự tạo .env rồi bật).
name: nt532

services:
  control:
    build:
      context: ../control
    env_file: .env
    volumes:
      - data:/app/data
    ports:
      - "${NT532_PORT:-8800}:8800"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8800/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  data:
