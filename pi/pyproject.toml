[project]
name = "nt532"
version = "0.1.0"
description = "Phần chạy trên Raspberry Pi của đồ án NT532: thị giác, CoAP và điều phối"
requires-python = ">=3.11"
dependencies = [
    "aiocoap>=0.4.12",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3", "torch>=2.6", "torchvision>=0.21"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

# Trên Windows lấy bản torch có CUDA để train; Pi dùng bản mặc định trên PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nt532"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
