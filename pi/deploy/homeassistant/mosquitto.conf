# Mosquitto cho trạm NT532: chỉ LAN, bắt buộc mật khẩu.
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd nt532      # tạo user (hỏi mật khẩu)
#   sudo mosquitto_passwd /etc/mosquitto/passwd homeassistant # thêm user cho HA
#   sudo cp mosquitto.conf /etc/mosquitto/conf.d/nt532.conf && sudo systemctl restart mosquitto
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
persistence true
