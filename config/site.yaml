# Số đo sa bàn và tham số dùng chung. Đơn vị: mét và độ.
# Các giá trị dưới đây là số đề xuất trong kế hoạch; thay bằng số đo thực sau khi dựng sa bàn.

table:
  width: 1.20   # dọc trục X
  depth: 0.80   # dọc trục Y

board:
  plane_y: 0.80  # bảng bia là mặt phẳng Y = plane_y
  # Mặt bảng trải từ X = 0 tới width và từ Z = 0 (mặt bàn) tới height.
  width: 1.20
  height: 0.60

tags:
  family: 36h11
  # ID là đề xuất, chưa chốt với nhóm.
  reference:
    size: 0.08
    # Tọa độ tâm tag [x, y] trên mặt bàn (z = 0), đo bằng thước.
    # Dán tag nằm ngửa, mép trên của tag hướng về bảng bia (+Y), cạnh song song mép bàn.
    positions:
      0: null
      1: null
      2: null
      3: null
  # Mỗi node H2 vừa là sensor vừa mang một cụm pan–tilt. Một tag trên đế cố định của node
  # cho cả vị trí sensor lẫn pose đế vòi; không dán lên phần quay.
  nodes:
    size: 0.08
    ids:
      s1: 21
      s2: 22

camera:
  index: 0
  width: 1280
  height: 720
  intrinsics: calibration/camera.yaml
  # Khóa lấy nét và phơi sáng để hiệu chuẩn giữ đúng và vết laser không bị cháy sáng.
  # null là để camera tự chỉnh. Giá trị tùy từng webcam; dò bằng `v4l2-ctl -l` trên Pi.
  focus: null
  exposure: null
  # Camera điện thoại: điện thoại đẩy RTMP lên mediamtx trên Pi, Pi đọc lại RTSP. url null là dùng webcam
  # (index ở trên). Xem docs/camera-dien-thoai.md. Độ phân giải, lấy nét, phơi sáng chỉnh trên ứng dụng.
  stream:
    url: null                  # ví dụ "rtsp://127.0.0.1:8554/cam"
    latency_s: 0.8             # độ trễ điện thoại → Pi; đo bằng scripts/stream_latency.py
    reconnect_s: 2.0
    timeout_s: 5.0
  # Bảng ChArUco in trên A4. Dùng từ điển 4x4 để không lẫn với tag 36h11 trên sa bàn.
  calib_board:
    dictionary: 4X4_50
    squares_x: 6
    squares_y: 9
    square: 0.030
    marker: 0.022

vision:
  weights: models/fire-n.pt     # Pi dùng bản NCNN: models/fire-n_ncnn_model
  detect_conf: 0.35
  imgsz: 640
  board_margin_m: 0.02          # nhận điểm lệch ra ngoài mép bảng tối đa chừng này
  commission_frames: 15         # số khung lấy trung vị khi commissioning và khi kiểm tra
  min_tag_rate: 0.6             # tag phải hiện trong ít nhất chừng này phần số khung
  camera_shift_px: 3.0          # tag tham chiếu lệch quá mức này thì coi camera bị xê dịch
  node_moved_m: 0.015           # tag node lệch quá mức này thì coi node bị dời
  laser_min_rise: 40            # kênh đỏ phải tăng ít nhất chừng này mới nhận là vết laser
  commissioning: calibration/commissioning.yaml

targeting:
  sensor_match_radius_x: 0.35  # chỉ nhận bia cách sensor báo động không quá khoảng này theo X
  localize_timeout_s: 3.0
  correct_max_iters: 3
  correct_done_m: 0.01
  tolerance_m: 0.03            # đề xuất, chốt cuối tuần 3

actuator:
  # Giới hạn để tia nước và laser không ra khỏi bảng; đo riêng cho từng node ở tuần 2.
  nodes:
    s1: {pan_limits: null, tilt_limits: null}
    s2: {pan_limits: null, tilt_limits: null}
  # Tâm quay pan–tilt tính từ tâm tag đế, trong hệ tag (X phải, Y về mép trên tag, Z lên). Hiếu đo.
  pivot_offset: [0.0, 0.0, 0.08]
  water_tilt_deg: 0.0          # góc cộng thêm vào tilt khi phun nước (quỹ đạo rơi); đo ở tuần 3
  heartbeat_ms: 500
  aim_ttl_ms: 1500
  fire_ms: 2000

sensors:
  # Ngưỡng báo động trên node; orchestrator và mô hình quyết định dùng cùng số. Đo thực ở tuần 2.
  temp_alarm_c: 45
  gas_alarm: 600

network:
  # CoAP server trên Pi và địa chỉ node (trước khi có SRP/DNS-SD ở tuần 4). Xem docs/orchestrator.md.
  bind: "::"
  port: 5683
  transports: null             # null: mặc định aiocoap (udp6). Máy không có IPv6: [simplesocketserver]
  nodes:
    s1: null                   # ví dụ "fd11:22::1" (địa chỉ mesh-local của H2) hoặc "s1.local"
    s2: null
